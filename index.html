<style>
:root{color-scheme:light dark;--bg:#F2F7FD;--card:#fff;--ink:#1B2350;--mut:#55607A;--line:#D3DDEA;--navy:#27367A;--gold:#EEB742;--bad:#B5523B}
@media (prefers-color-scheme:dark){:root{--bg:#0F1530;--card:#18204A;--ink:#EEF1FA;--mut:#A6AFCB;--line:#2E386A;--navy:#7F97E8}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:20px;padding:24px 20px;box-shadow:0 10px 30px rgba(27,35,80,.08)}
h1{margin:0 0 4px;font:700 1.5rem/1.25 Georgia,serif;color:var(--navy)}p{margin:0 0 16px;color:var(--mut);font-size:.92rem}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:.9rem;color:var(--mut)}.row input{width:20px;height:20px}
button{width:100%;border:0;border-radius:12px;padding:13px;min-height:48px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}
.msg{min-height:1.4em;margin-top:10px;font-size:.88rem;color:var(--bad)}.msg.ok{color:var(--mut)}
.show{background:none;color:var(--mut);width:auto;min-height:0;padding:4px 0;font-weight:600;font-size:.85rem;margin-top:6px}
</style></head><body>
